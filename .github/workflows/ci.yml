name: F1 Pipeline CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    name: Lint & Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      # ── Checkout ──────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Python setup ──────────────────────────────────────────
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # ── Install dependencies ──────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── Lint with Ruff ────────────────────────────────────────
      - name: Lint (ruff)
        run: |
          ruff check ingestion/ tests/ --output-format=github

      # ── Run unit tests ────────────────────────────────────────
      - name: Run tests with coverage
        env:
          # Fake env-vars so config loader doesn't fail during tests
          GCP_PROJECT_ID: "test-project"
          GCS_BUCKET: "test-bucket"
          DATAPROC_SA: "test@test.iam.gserviceaccount.com"
          LOCAL_MODE: "1"
        run: |
          pytest tests/ \
            --cov=ingestion \
            --cov-report=term-missing \
            --cov-report=xml \
            -v

      # ── Upload coverage ───────────────────────────────────────
      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
