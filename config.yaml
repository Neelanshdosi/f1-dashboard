# ─────────────────────────────────────────────
#  F1 Analytics Pipeline – Central Configuration
# ─────────────────────────────────────────────
gcp:
  project_id: "${GCP_PROJECT_ID}"          # set via env-var or override here
  region: "us-central1"
  dataproc_sa: "${DATAPROC_SA}"            # Dataproc Serverless service account

storage:
  bucket: "${GCS_BUCKET}"                  # gs://<bucket>  (no gs:// prefix)
  bronze_prefix: "bronze"
  silver_prefix: "silver"
  gold_prefix:   "gold"

bigquery:
  dataset: "f1_analytics"
  location: "US"
  session_key_partition:
    start: 9000
    end: 12000
    interval: 1
  gold_tables:
    agg_driver_race_summary:
      clustering_fields: [driver_number, team_name]
    agg_tyre_degradation:
      clustering_fields: [compound, driver_number]
    agg_pit_strategy:
      clustering_fields: [driver_number, compound]
    agg_weather_impact:
      clustering_fields: [session_key]
    agg_driver_telemetry:
      clustering_fields: [driver_number]
    agg_race_results:
      clustering_fields: [driver_number, team_name]

# ── Dashboard ────────────────────────────────
dashboard:
  session_keys:
    - 9472
    - 9693
    - 10014
    - 9979
    - 9947
    - 9839

# ── Data Quality & Validation Rules ─────────
quality:
  # Laps: conservative limits allowing SC laps, in/out laps (seconds)
  lap_time_min_seconds: 50.0
  lap_time_max_seconds: 300.0
  # Stints: minimum laps
  stint_lap_min: 1
  # Pit stops: durations in seconds
  pit_duration_min_seconds: 5.0
  pit_duration_max_seconds: 300.0
  # Empirical threshold: slowest Safety Car transit seen 16.9 s (2025 Australia, lap 3),
  # fastest threshold-only real stop 19.4 s (2025 Monaco); 2024 Bahrain rows all at least 23.8 s;
  # validated on these six races only.
  pit_stop_min_duration_seconds: 18.0
  # Weather: reasonable physical bounds
  track_temp_min: 0.0
  track_temp_max: 85.0
  air_temp_min: 0.0
  air_temp_max: 60.0

# ── Ingestion ────────────────────────────────
openf1:
  base_url: "https://api.openf1.org/v1"
  rate_limit:
    requests_per_minute: 30
    requests_per_second: 3
  retry:
    max_attempts: 5
    backoff_base_seconds: 2       # exponential: base^attempt + jitter
    backoff_max_seconds: 60
  timeout_seconds: 30

# Endpoints to pull (order matters for dependency)
endpoints:
  - sessions
  - drivers
  - laps
  - stints
  - pit
  - weather
  - car_data
  - session_result
  - starting_grid

# ── Scope ─────────────────────────────────────
# Start small: 2–3 races, confirm row counts, then expand
seasons:
  - 2024

# session_type filter: "Race" | "Qualifying" | "Sprint" | null (all)
session_type_filter: "Race"

# DEV SETTING: Limit races per season while validating locally (null = all).
max_sessions_per_season: 3

# DEV SETTING: Per-session telemetry cap while validating locally (null = no cap).
car_data_row_cap: 50000

# Full-run example (remove the leading # characters to process all sessions):
# seasons:
#   - 2023
#   - 2024
#   - 2025
# max_sessions_per_season: null
# car_data_row_cap: null

# ── Spark ─────────────────────────────────────
spark:
  app_name: "f1_pipeline"
  executor_memory: "4g"
  driver_memory: "2g"
  shuffle_partitions: 8

# ── Logging ───────────────────────────────────
logging:
  level: "INFO"
  format: "json"           # "json" | "text"
  log_file: "logs/pipeline.log"
